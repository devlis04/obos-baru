name: gudang
description: Obos gudang
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  geolocator: ^14.0.3
  mobile_scanner: ^7.1.3
  supabase_flutter: ^2.17.2
  obos_core:
    path: ../../packages/obos_core
  obos_auth:
    path: ../../packages/obos_auth

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/app_icon.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/icon/app_icon.png
  adaptive_icon_foreground_inset: 22
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/.env
    - assets/icon/app_icon_white.png
    - assets/icon/app_icon.png
